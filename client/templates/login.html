<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f2e9;
      --bg-accent: #efe6da;
      --card: #fffdf8;
      --text-main: #16243a;
      --text-muted: #4a5972;
      --input-border: #cdd8df;
      --input-focus: #2d7a73;
      --button-bg: #2e7f78;
      --button-hover: #276c66;
      --button-text: #f6f9f8;
      --error-bg: #f9e2df;
      --error-text: #8d2d24;
      --shadow: 0 24px 48px rgba(22, 36, 58, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: "Source Sans 3", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 12% 16%, rgba(46, 127, 120, 0.11), transparent 34%),
        radial-gradient(circle at 82% 78%, rgba(22, 36, 58, 0.08), transparent 37%),
        linear-gradient(165deg, var(--bg) 0%, var(--bg-accent) 100%);
    }

    .login-card {
      width: min(430px, 100%);
      background: var(--card);
      border: 1px solid rgba(22, 36, 58, 0.1);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 2.1rem 2rem 1.9rem;
      animation: card-enter 0.55s ease both;
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: var(--button-bg);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 0.4rem;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(1.45rem, 3vw, 1.7rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .intro {
      margin: 0 0 1.4rem;
      color: var(--text-muted);
      font-size: 1.03rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      border: 1px solid var(--input-border);
      border-radius: 11px;
      background: #fff;
      color: var(--text-main);
      font: inherit;
      font-size: 1rem;
      padding: 0.78rem 0.85rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(45, 122, 115, 0.17);
    }

    .error {
      margin: 0 0 1rem;
      border: 1px solid rgba(141, 45, 36, 0.2);
      border-radius: 11px;
      background: var(--error-bg);
      color: var(--error-text);
      padding: 0.7rem 0.8rem;
      font-weight: 600;
    }

    button[type="submit"] {
      width: 100%;
      border: none;
      border-radius: 11px;
      background: var(--button-bg);
      color: var(--button-text);
      font-family: "Space Grotesk", sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 0.8rem 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    button[type="submit"]:hover {
      background: var(--button-hover);
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(39, 108, 102, 0.27);
    }

    button[type="submit"]:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .signup-link {
      margin: 1.15rem 0 0;
      text-align: center;
      color: var(--text-muted);
    }

    .signup-link a {
      color: var(--button-bg);
      font-weight: 700;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .founders-note {
      margin: 1.25rem 0 0;
      text-align: center;
      color: rgba(22, 36, 58, 0.45);
      font-size: 0.9rem;
      line-height: 1.4;
      font-weight: 400;
    }

    .founders-names {
      color: inherit;
      font-size: inherit;
      font-weight: inherit;
    }

    @keyframes card-enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 540px) {
      body {
        padding: 0.9rem;
      }

      .login-card {
        padding: 1.65rem 1.2rem 1.45rem;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="login-card" role="main">
    <p class="eyebrow">The Daily Nudge</p>
    <h1>Consistency made simple.</h1>
    <p class="intro">Sign in to keep your habit streak going.</p>

    <form method="post">
      {% csrf_token %}
      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>

      <button type="submit">Sign In</button>
    </form>

    <p class="signup-link">New here? <a href="{% url 'signup' %}">Create an account</a></p>
    <p class="founders-note">Built by <span class="founders-names">Joshua Leon-Ortiz, Lucas Heinrichs, and Kwadwo Afriyie</span></p>
  </main>
</body>
</html>
