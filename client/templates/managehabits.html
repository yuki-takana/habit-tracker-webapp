<!DOCTYPE html>
<html>
<head>
    <title>Manage Habits</title>

    <style>
        .modal {
            display: none; 
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            position: relative;
            background-color: white;
            width: 400px;
            margin: 10% auto;
            padding: 20px;
            border-radius: 8px;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
        }

        .close:hover {
            color: red;
        }
    </style>
</head>

<body>

<!-- Django Messages -->
{% if messages %}
<div class="messages">
    {% for message in messages %}
        <div class="message {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

<!-- Add Habit Button -->
<p><button id="openModal">Add Habit</button><p>

<!-- Modal -->
<div id="habitModal" class="modal">
    <div class="modal-content">
        <span class="close" id="closeModal">&times;</span>
        <h2>Add New Habit</h2>

        <form method="POST" action="{% url 'managehabits' %}">
            {% csrf_token %}

            <label>Habit Name:</label><br>
            <input type="text" name="name" required><br><br>

            <label>Frequency (1 = daily, 7 = weekly):</label><br>
            <input type="number" name="frequency" min="1" value="1" required><br><br>

            <button type="submit">Add</button>
        </form>
    </div>
</div>

<script>
    const modal = document.getElementById("habitModal");
    const openBtn = document.getElementById("openModal");
    const closeBtn = document.getElementById("closeModal");

    openBtn.onclick = function() {
        modal.style.display = "block";
    }

    closeBtn.onclick = function() {
        modal.style.display = "none";
    }

    window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>

<a href="{% url 'dashboard' %}">Dashboard</a>

</body>
</html>
