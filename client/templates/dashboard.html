
<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
</head>

<body>
    <h1>Welcome, {{ request.user.username }}!</h1>

    {% for item in habit_data %}
        <p>{{ item.habit.name }} - Current streak: {{ item.streak }}</p>
    {% empty %}
        <p>You have no habits yet.</p>
    {% endfor %}

    <a href="{% url 'managehabits' %}">Manage Habits</a><br><br>
    <a href="{% url 'logout' %}">Logout</a>
</body>

</html>
